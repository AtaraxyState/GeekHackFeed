name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes diff against the previous tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            RELEASE=true
          else
            # Unpublished build. Resolves to versionCode 0, so if one is ever
            # sideloaded it still sees every real release as newer.
            NAME="0.0.0"
            RELEASE=false
          fi
          echo "name=${NAME}"       >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Building ${NAME} (publish: ${RELEASE})"

      - name: Ensure Android build tools
        run: |
          set -euo pipefail
          echo "SDK root: ${ANDROID_SDK_ROOT}"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "${ANDROID_SDK_ROOT}/platforms/android-34" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34"
          fi
          if ! ls "${ANDROID_SDK_ROOT}/build-tools" | grep -q .; then
            "$SDKMANAGER" "build-tools;34.0.0"
          fi
          echo "build-tools: $(ls ${ANDROID_SDK_ROOT}/build-tools | tr '\n' ' ')"
          echo "platforms:   $(ls ${ANDROID_SDK_ROOT}/platforms | tr '\n' ' ')"

      # A release must be signed with a *stable* key: Android refuses to install
      # an APK over one signed with a different key, so a per-run key would mean
      # no release could ever update another and the in-app updater would be
      # useless. This repo gets that stability from a committed key whose
      # password is public (android/public-release.keystore), so there is
      # nothing to configure. Setting both KEYSTORE_BASE64 and KEYSTORE_PASSWORD
      # overrides it with a private key -- both, because a keystore without its
      # password cannot be opened, and half-configuring it should not silently
      # produce differently-signed releases.
      - name: Pick the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
            echo "private=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the private key from KEYSTORE_BASE64"
          else
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              echo "::warning::KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD is"
              echo "::warning::not, so it cannot be opened. Falling back to the"
              echo "::warning::committed public key. Set both, or delete the"
              echo "::warning::unused secret. See README, 'Release signing'."
            fi
            test -f android/public-release.keystore
            echo "path=android/public-release.keystore" >> "$GITHUB_OUTPUT"
            echo "private=false" >> "$GITHUB_OUTPUT"
            echo "Signing with the committed public key (password: android)"
          fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE: ${{ steps.keystore.outputs.path }}
          PRIVATE: ${{ steps.keystore.outputs.private }}
        run: |
          set -euo pipefail
          ARGS=(--version-name "${{ steps.version.outputs.name }}")
          ARGS+=(--keystore "${KEYSTORE}" --key-alias "${KEY_ALIAS:-geekhackfeed}")
          if [ "${PRIVATE}" = "true" ]; then
            ARGS+=(--ks-pass "env:KS_PASS")
            # Only pass --key-pass when it is actually set: build.py already
            # falls back to the store password, and an empty env: value would
            # override that fallback with nothing.
            if [ -n "${KEY_PASS:-}" ]; then
              ARGS+=(--key-pass "env:KEY_PASS")
            fi
          else
            ARGS+=(--ks-pass "pass:android")
          fi
          python android/build.py "${ARGS[@]}"

      # Same key across releases is the whole ballgame for the updater, so put
      # the certificate digest in the log where it can be compared by eye.
      - name: Show signing certificate
        run: |
          BT=$(ls -1 "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)
          "${ANDROID_SDK_ROOT}/build-tools/${BT}/apksigner" verify \
            --print-certs android/geekhack-feed.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: geekhack-feed-${{ steps.version.outputs.name }}
          path: android/geekhack-feed.apk
          if-no-files-found: error

      - name: Write release notes
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "${PREV}" ]; then
              echo "### Changes since ${PREV}"
              git log --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              echo "### Changes"
              git log --pretty='- %s' -20
            fi
            echo
            echo "Install the APK below. The app checks this page for newer"
            echo "releases and can install them itself."
          } > "${RUNNER_TEMP}/notes.md"

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/geekhack-feed.apk \
            --title "geekhack feed ${{ steps.version.outputs.name }}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
